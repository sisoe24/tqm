name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pipx install poetry
          poetry env use python
          poetry install --no-interaction

      - name: Check tag matches package version
        run: test "v$(poetry version -s)" = "$GITHUB_REF_NAME"

      # _resources_rc.py is gitignored, so a fresh checkout must generate it.
      - name: Compile resources
        run: poetry run python scripts/compile_resources.py

      - run: poetry build

      - name: Check wheel ships the resources
        run: unzip -l dist/*.whl | grep -q 'tqm/_resources_rc.py'

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes "See CHANGELOG.md."

  # A separate job, so only the upload step holds the PyPI token.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
